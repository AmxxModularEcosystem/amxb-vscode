name: Build & Attach VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Align package.json with the release version
        # npm version синхронизирует package.json (и package-lock.json) с тегом релиза,
        # чтобы VSIX собрался с правильной версией.
        # --allow-same-version: повторный запуск уже имеет эту версию — не падать.
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        # vsce сам запустит vscode:prepublish → npm run build
        run: npx @vscode/vsce package -o amxb-vscode.vsix

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: amxb-vscode.vsix

      - name: Commit version bump to master and move tag
        # Коммитим бамп на актуальный master, а не на тег, чтобы push оставался
        # fast-forward, даже если master ушёл вперёд после создания тега.
        run: |
          # Раннер не имеет git identity по умолчанию; нужен и для commit, и для
          # аннотированного tag (у тега есть tagger identity) — задаём один раз.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout --detach origin/master
          VERSION="${{ github.event.release.tag_name }}"
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          if git diff --quiet package.json package-lock.json; then
            echo "package.json already at ${VERSION#v} on master, nothing to commit"
          else
            git add package.json package-lock.json
            git commit -m "chore: bump version to ${VERSION#v}"
            git push origin HEAD:master
            # Двигаем тег на коммит бампа, чтобы checkout тега отдавал правильную версию
            git tag -fa "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION" --force
          fi
